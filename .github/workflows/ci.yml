name: CI (Manual GitHub Dispatch)
# Canonical CI runs natively on NVIDIA DGX Spark via Forgejo Actions (.forgejo/workflows/ci.yml).
# GitHub Actions is set to workflow_dispatch only to prevent billable runner minutes.
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --verbose
      - run: cargo test --verbose
      - run: cargo run --release -- verify
      - run: cargo run --release -- generate --output assets
