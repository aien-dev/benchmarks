[package]
name = "aien-benchmarks"
version = "0.1.0"
edition = "2021"
authors = ["Drake Stapleton <drake.aien@proton.me>"]
description = "Sovereign Systems Benchmark Suite: reproducible performance comparisons on NVIDIA DGX Spark Grace Blackwell"
license = "Apache-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.37", features = ["rt-multi-thread", "sync", "macros", "time"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
aien-platform = { path = "../canonical-branch-native-runtime/crates/aien-platform" }
aien-platform-linux = { path = "../canonical-branch-native-runtime/crates/aien-platform-linux" }
aien-kv-cache = { path = "../canonical-branch-native-runtime/crates/aien-kv-cache" }
aien-scheduler = { path = "../canonical-branch-native-runtime/crates/aien-scheduler" }
aien-inference-abi = { path = "../canonical-branch-native-runtime/crates/aien-inference-abi" }
parking_lot = "0.12"

[[bin]]
name = "aien-benchmarks"
path = "src/main.rs"

[[bin]]
name = "bench_branching_neutral"
path = "src/bin/bench_branching_neutral.rs"

[[bin]]
name = "bench_canonical_suite"
path = "src/bin/bench_canonical_suite.rs"
