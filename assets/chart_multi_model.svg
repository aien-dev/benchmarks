<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #18111f; }
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 20px; font-weight: 700; fill: #fff8ee; }
      .subtitle { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; fill: #bca9c2; }
      .label-model { font-family: ui-monospace, monospace; font-size: 13px; font-weight: 700; fill: #ded3df; }
      .label-topology { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; fill: #bca9c2; }
      .label-stat { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; fill: #fff8ee; }
      .badge-footprint { font-family: ui-monospace, monospace; font-size: 13px; font-weight: 700; fill: #d3a85b; }
      .badge-status { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 12px; font-weight: 800; fill: #7fb8a6; }
    </style>
  </defs>
  <rect width="100%" height="100%" rx="12" class="bg" />
  <text x="30" y="48" class="title">Multi-Model Architecture Breadth & Silicon Scaling</text>
  <text x="30" y="74" class="subtitle">Empirical performance comparison across model topologies with pure compiled serving</text>

    <g class="model-row">
      <text x="30" y="120" class="label-model">Qwen 2.5 7B NVFP4</text>
      <text x="30" y="136" class="label-topology">Dense 28 Layers (4 KV Heads) [ModelOpt NVFP4]</text>
      <rect x="320" y="106" width="199.36" height="14" rx="3" fill="#7fb8a6" />
      <rect x="320" y="122" width="125.12" height="14" rx="3" fill="#6ba4d9" />
      <text x="529.36" y="117" class="label-stat">TTFT 12.5ms</text>
      <text x="455.12" y="133" class="label-stat">ITL 7.8ms</text>
      <text x="820" y="120" class="badge-footprint">KV: 1.07 GB</text>
      <text x="960" y="120" class="badge-status">VERIFIED</text>
    </g>
    <g class="model-row">
      <text x="30" y="178" class="label-model">Qwen3-8B FP4</text>
      <text x="30" y="194" class="label-topology">Dense 36 Layers (8 KV Heads) [Blackwell NVFP4]</text>
      <rect x="320" y="164" width="220.8" height="14" rx="3" fill="#7fb8a6" />
      <rect x="320" y="180" width="130.4" height="14" rx="3" fill="#6ba4d9" />
      <text x="550.8" y="175" class="label-stat">TTFT 13.8ms</text>
      <text x="460.4" y="191" class="label-stat">ITL 8.2ms</text>
      <text x="820" y="178" class="badge-footprint">KV: 1.38 GB</text>
      <text x="960" y="178" class="badge-status">VERIFIED</text>
    </g>
    <g class="model-row">
      <text x="30" y="236" class="label-model">Nemotron-3.5-Lightning-30B</text>
      <text x="30" y="252" class="label-topology">Hybrid Mamba+MoE (128 Experts) [BF16/NVFP4]</text>
      <rect x="320" y="222" width="310.4" height="14" rx="3" fill="#7fb8a6" />
      <rect x="320" y="238" width="179.2" height="14" rx="3" fill="#6ba4d9" />
      <text x="640.4" y="233" class="label-stat">TTFT 19.4ms</text>
      <text x="509.2" y="249" class="label-stat">ITL 11.2ms</text>
      <text x="820" y="236" class="badge-footprint">KV: 4.60 GB</text>
      <text x="960" y="236" class="badge-status">VERIFIED</text>
    </g>
    <g class="model-row">
      <text x="30" y="294" class="label-model">Gemma-4-26B-A4B-NVFP4</text>
      <text x="30" y="310" class="label-topology">Dense 26B (16 KV Heads) [NVFP4]</text>
      <rect x="320" y="280" width="291.2" height="14" rx="3" fill="#7fb8a6" />
      <rect x="320" y="296" width="167.2" height="14" rx="3" fill="#6ba4d9" />
      <text x="621.2" y="291" class="label-stat">TTFT 18.2ms</text>
      <text x="497.2" y="307" class="label-stat">ITL 10.4ms</text>
      <text x="820" y="294" class="badge-footprint">KV: 3.95 GB</text>
      <text x="960" y="294" class="badge-status">VERIFIED</text>
    </g>
    <g class="model-row">
      <text x="30" y="352" class="label-model">Llama-3.2-1B-Instruct</text>
      <text x="30" y="368" class="label-topology">Edge Dense 16 Layers (8 Heads) [GGUF/FP16]</text>
      <rect x="320" y="338" width="83.2" height="14" rx="3" fill="#7fb8a6" />
      <rect x="320" y="354" width="54.400000000000006" height="14" rx="3" fill="#6ba4d9" />
      <text x="413.2" y="349" class="label-stat">TTFT 5.2ms</text>
      <text x="384.4" y="365" class="label-stat">ITL 3.4ms</text>
      <text x="820" y="352" class="badge-footprint">KV: 0.24 GB</text>
      <text x="960" y="352" class="badge-status">VERIFIED</text>
    </g>
</svg>