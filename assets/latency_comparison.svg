<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #18111f; }
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 20px; font-weight: 700; fill: #fff8ee; }
      .subtitle { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; fill: #bca9c2; }
      .label-service { font-family: ui-monospace, monospace; font-size: 14px; font-weight: 700; fill: #ded3df; }
      .label-role { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; fill: #8eac78; }
      .label-val { font-family: ui-monospace, monospace; font-size: 13px; font-weight: 700; fill: #fff8ee; }
      .throughput { font-size: 12px; font-weight: 600; fill: #ef8b67; }
      .grid { stroke: rgba(222, 211, 223, 0.12); stroke-width: 1; }
    </style>
  </defs>
  <rect width="100%" height="100%" rx="12" class="bg" />
  <text x="30" y="48" class="title">HTTP Gateway Latency (p50 TTFB) and Throughput</text>
  <text x="30" y="74" class="subtitle">Localhost multi-threaded sweep: concurrency=10, 500 requests per endpoint on Grace Blackwell</text>
  <line x1="360" y1="95" x2="360" y2="470" class="grid" />
  <line x1="640" y1="95" x2="640" y2="470" class="grid" />
  <line x1="920" y1="95" x2="920" y2="470" class="grid" />

    <g class="bar-row">
      <text x="30" y="120" class="label-service">python-fastapi-baseline /api/status</text>
      <text x="30" y="136" class="label-role">Python FastAPI Baseline Ping [CPython 3.12 + Uvicorn]</text>
      <rect x="360" y="104" width="15.927980444444445" height="28" rx="4" fill="#7fb8a6" />
      <text x="397.9279804444445" y="123" class="label-val">1.28 ms <tspan class="throughput">(7251.6 req/s)</tspan></text>
    </g>
    <g class="bar-row">
      <text x="30" y="188" class="label-service">cortex-rs /api/cortex/get</text>
      <text x="30" y="204" class="label-role">Cortex Canonical Retrieval [Rust Axum + SQLite WAL]</text>
      <rect x="360" y="172" width="6.228705777777777" height="28" rx="4" fill="#7fb8a6" />
      <text x="388.2287057777778" y="191" class="label-val">0.50 ms <tspan class="throughput">(19366.6 req/s)</tspan></text>
    </g>
    <g class="bar-row">
      <text x="30" y="256" class="label-service">spark-cockpit-rs /api/pulse</text>
      <text x="30" y="272" class="label-role">Real-time System Pulse [Rust Axum]</text>
      <rect x="360" y="240" width="20.237416888888887" height="28" rx="4" fill="#7fb8a6" />
      <text x="402.2374168888889" y="259" class="label-val">1.63 ms <tspan class="throughput">(5840.2 req/s)</tspan></text>
    </g>
    <g class="bar-row">
      <text x="30" y="324" class="label-service">cortex-encoder-rs /health</text>
      <text x="30" y="340" class="label-role">ONNX Runtime Service Health [Rust Axum + ONNX Runtime]</text>
      <rect x="360" y="308" width="6" height="28" rx="4" fill="#7fb8a6" />
      <text x="388" y="327" class="label-val">0.26 ms <tspan class="throughput">(34684.6 req/s)</tspan></text>
    </g>
</svg>