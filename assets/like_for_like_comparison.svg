<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #18111f; }
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 20px; font-weight: 700; fill: #fff8ee; }
      .subtitle { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; fill: #bca9c2; }
      .label-service { font-family: ui-monospace, monospace; font-size: 13px; font-weight: 700; fill: #ded3df; }
      .label-lang-rust { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; fill: #7fb8a6; }
      .label-lang-py { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; fill: #d7755d; }
      .label-val { font-family: ui-monospace, monospace; font-size: 12px; font-weight: 600; fill: #fff8ee; }
      .badge-speedup { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 15px; font-weight: 800; fill: #7fb8a6; }
      .badge-mem { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: #ef8b67; }
    </style>
  </defs>
  <rect width="100%" height="100%" rx="12" class="bg" />
  <text x="30" y="48" class="title">Like-for-Like Microservice Benchmark: Rust Native vs CPython 3.12</text>
  <text x="30" y="74" class="subtitle">Identical payloads, in-memory SQLite tables, and vector workloads tested concurrently on Grace Blackwell</text>

    <g class="lfl-row">
      <text x="30" y="120" class="label-service">HTTP Microservice: Minimal JSON Status Ping (/api/status)</text>
      <!-- Rust Bar -->
      <text x="50" y="144" class="label-lang-rust">Rust Native:</text>
      <rect x="180" y="130" width="69.7804" height="18" rx="3" fill="#7fb8a6" />
      <text x="269.7804" y="144" class="label-val">0.35 ms (13774 req/s)</text>

      <!-- Python Bar -->
      <text x="50" y="168" class="label-lang-py">CPython 3.12:</text>
      <rect x="180" y="154" width="255.9854" height="18" rx="3" fill="#d7755d" />
      <text x="455.9854" y="168" class="label-val">1.28 ms (7252 req/s)</text>

      <!-- Badge -->
      <text x="820" y="146" class="badge-speedup">3.7x Faster</text>
      <text x="820" y="166" class="badge-mem">(-94.2% RAM)</text>
    </g>
    <g class="lfl-row">
      <text x="30" y="220" class="label-service">Database & Serialization: Single Entity Query & JSON Serialization (/api/query)</text>
      <!-- Rust Bar -->
      <text x="50" y="244" class="label-lang-rust">Rust Native:</text>
      <rect x="180" y="230" width="74.1902" height="18" rx="3" fill="#7fb8a6" />
      <text x="274.1902" y="244" class="label-val">0.37 ms (13203 req/s)</text>

      <!-- Python Bar -->
      <text x="50" y="268" class="label-lang-py">CPython 3.12:</text>
      <rect x="180" y="254" width="568.458" height="18" rx="3" fill="#d7755d" />
      <text x="768.458" y="268" class="label-val">2.84 ms (3128 req/s)</text>

      <!-- Badge -->
      <text x="820" y="246" class="badge-speedup">7.7x Faster</text>
      <text x="820" y="266" class="badge-mem">(-94.2% RAM)</text>
    </g>
    <g class="lfl-row">
      <text x="30" y="320" class="label-service">Vector & SIMD Compute: 768-dimensional Vector Dot Product (/api/vector)</text>
      <!-- Rust Bar -->
      <text x="50" y="344" class="label-lang-rust">Rust Native:</text>
      <rect x="180" y="330" width="46.0584" height="18" rx="3" fill="#7fb8a6" />
      <text x="246.0584" y="344" class="label-val">0.23 ms (16824 req/s)</text>

      <!-- Python Bar -->
      <text x="50" y="368" class="label-lang-py">CPython 3.12:</text>
      <rect x="180" y="354" width="316.4214" height="18" rx="3" fill="#d7755d" />
      <text x="516.4214" y="368" class="label-val">1.58 ms (6130 req/s)</text>

      <!-- Badge -->
      <text x="820" y="346" class="badge-speedup">6.9x Faster</text>
      <text x="820" y="366" class="badge-mem">(-94.2% RAM)</text>
    </g>
</svg>