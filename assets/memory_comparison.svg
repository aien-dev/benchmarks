<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #18111f; }
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 20px; font-weight: 700; fill: #fff8ee; }
      .subtitle { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; fill: #bca9c2; }
      .label-service { font-family: ui-monospace, monospace; font-size: 14px; font-weight: 700; fill: #ded3df; }
      .label-role { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; fill: #8eac78; }
      .label-val { font-family: ui-monospace, monospace; font-size: 13px; font-weight: 700; fill: #fff8ee; }
      .badge { font-size: 11px; font-weight: 600; fill: #ef8b67; }
      .grid { stroke: rgba(222, 211, 223, 0.12); stroke-width: 1; }
    </style>
  </defs>
  <rect width="100%" height="100%" rx="12" class="bg" />
  <text x="30" y="48" class="title">Memory Resident Set Size (RSS): Native Rust vs Python Stacks</text>
  <text x="30" y="74" class="subtitle">Measured on NVIDIA DGX Spark (Grace Blackwell GB10, aarch64) via /proc/[pid]/status VmRSS</text>
  <line x1="280" y1="95" x2="280" y2="480" class="grid" />
  <line x1="580" y1="95" x2="580" y2="480" class="grid" />
  <line x1="880" y1="95" x2="880" y2="480" class="grid" />

    <g class="bar-row">
      <text x="30" y="120" class="label-service">python-agent-baseline</text>
      <text x="30" y="135" class="label-role">Legacy Agent Daemon [Python 3.12 + PyTorch + LangChain]</text>
      <rect x="280" y="104" width="590.13" height="26" rx="4" fill="#d7755d" />
      <text x="892.13" y="122" class="label-val">3737.49 MB <tspan class="badge">(Baseline)</tspan></text>
    </g>
    <g class="bar-row">
      <text x="30" y="178" class="label-service">openclaw-rs</text>
      <text x="30" y="193" class="label-role">Sovereign Gateway & Heartbeat [Native Rust (Grace Blackwell)]</text>
      <rect x="280" y="162" width="4" height="26" rx="4" fill="#7fb8a6" />
      <text x="306" y="180" class="label-val">4.79 MB <tspan class="badge">(-99.9%)</tspan></text>
    </g>
    <g class="bar-row">
      <text x="30" y="236" class="label-service">cortex-rs</text>
      <text x="30" y="251" class="label-role">Canonical Memory Engine [Native Rust + SQLite WAL]</text>
      <rect x="280" y="220" width="4" height="26" rx="4" fill="#7fb8a6" />
      <text x="306" y="238" class="label-val">10.67 MB <tspan class="badge">(-99.7%)</tspan></text>
    </g>
    <g class="bar-row">
      <text x="30" y="294" class="label-service">spark-cockpit-rs</text>
      <text x="30" y="309" class="label-role">Real-time Telemetry Cockpit [Native Rust + Axum]</text>
      <rect x="280" y="278" width="4" height="26" rx="4" fill="#7fb8a6" />
      <text x="306" y="296" class="label-val">10.05 MB <tspan class="badge">(-99.7%)</tspan></text>
    </g>
    <g class="bar-row">
      <text x="30" y="352" class="label-service">cortex-encoder-rs</text>
      <text x="30" y="367" class="label-role">Neural Embedding Microservice [Rust + ONNX Runtime (BGE-M3)]</text>
      <rect x="280" y="336" width="122.66385690789474" height="26" rx="4" fill="#d7755d" />
      <text x="424.66385690789474" y="354" class="label-val">776.87 MB <tspan class="badge">(-79.2%)</tspan></text>
    </g>
</svg>