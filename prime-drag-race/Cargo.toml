[package]
name = "prime-race"
version = "0.1.0"
edition = "2021"
authors = ["Drake Stapleton <aien@aienos.com>"]
description = "AIEN Prime Drag Race suite runner: independent reference, strict validation, trial protocol, receipts"
license = "AGPL-3.0-or-later"

# Standalone on purpose: the parent crate has path dependencies on a sibling checkout
# (canonical-branch-native-runtime) and cannot be built on its own.
[workspace]

[lib]
name = "prime_race"
path = "src/lib.rs"

[[bin]]
name = "prime_race"
path = "src/main.rs"

[dependencies]
serde_json = "1.0"
sha2 = "0.10"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
